[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "projectwhoop"
version = "0.1.0"
description = "Offline-verifiable WHOOP data ingestion and local analytics pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "projectWHOOP contributors" }]
dependencies = [
  "duckdb>=1.1,<2",
  "numpy>=1.24,<3",
  "pandas>=2.1,<4",
  "pandera[pandas]>=0.22,<0.29",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pandas-stubs>=2.1,<3",
  "pre-commit>=3.8,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "responses>=0.25,<1",
  "ruff>=0.8,<1",
  "types-requests>=2.31,<3",
]
notebooks = [
  "jupyter>=1,<2",
  "matplotlib>=3.7,<4",
  "seaborn>=0.12,<1",
]

[project.scripts]
whoop-download = "whoop_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/whoop_pipeline"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["whoop_pipeline"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = [
  "src/whoop_client.py",
  "src/whoop_oauth.py",
  "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["whoop_pipeline"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["duckdb.*", "pandera.*"]
ignore_missing_imports = true

